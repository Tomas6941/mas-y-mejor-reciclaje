<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mas y mejor reciclaje: encontrá puntos de reciclaje en Córdoba, aprendé a separar tus residuos, consultá horarios y seguí tu impacto ambiental."
    />
    <meta name="theme-color" content="#FAF7F0" />
    <title>Mas y mejor reciclaje | Reciclar en Córdoba</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23157F3D'/%3E%3Cpath d='M46 16c-12 0-23 5-23 17 0 5 3 9 8 9 12 0 16-14 15-26Z' fill='%23F5C134'/%3E%3Cpath d='M19 48c2-11 8-18 17-22' fill='none' stroke='%23FAF7F0' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Aplica el tema guardado antes del primer render para evitar un destello.
      // La clave ecopunto.theme.v1 guarda un string crudo: "dark" o "light".
      (function () {
        try {
          var stored = localStorage.getItem('ecopunto.theme.v1');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem; text-align: center">
        Mas y mejor reciclaje necesita JavaScript para funcionar. Activá JavaScript en tu navegador y recargá
        la página.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
